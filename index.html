<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo de entradas y salidas · HospedaRuta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: señalética vial. Azul petróleo + ámbar de señal. Barra lateral de índice y marco de pantalla de salida. */
:root{
  --ink:#14232e; --muted:#566872; --bg:#eef2f4; --surface:#ffffff; --line:#d3dce1;
  --brand:#0f4c5c; --brand-ink:#ffffff; --accent:#f2a900; --accent-ink:#2a1d00;
  --ok:#1b7a4b; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b3261e; --bad-bg:#fde8e6;
  --shade:#f6f9fa; --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --font-body:'Barlow',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e6eef2; --muted:#9db0ba; --bg:#0e171d; --surface:#16232b; --line:#2a3b45;
    --brand:#5fb4c9; --brand-ink:#08222a; --accent:#f2b92e; --accent-ink:#2a1d00;
    --ok:#6fd09b; --ok-bg:#16352a; --warn:#f0b45a; --warn-bg:#3a2a10; --bad:#ff8e84; --bad-bg:#3d1b18; --shade:#1b2a33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eef2; --muted:#9db0ba; --bg:#0e171d; --surface:#16232b; --line:#2a3b45;
  --brand:#5fb4c9; --brand-ink:#08222a; --accent:#f2b92e; --accent-ink:#2a1d00;
  --ok:#6fd09b; --ok-bg:#16352a; --warn:#f0b45a; --warn-bg:#3a2a10; --bad:#ff8e84; --bad-bg:#3d1b18; --shade:#1b2a33; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:var(--brand-ink)}
.topbar b{font-family:var(--font-display);font-size:22px;letter-spacing:.03em}
.topbar span{font-size:14px;opacity:.9}
.topbar .tag{margin-left:auto;background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:3px;font-weight:600;font-size:13px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding:20px 16px 40px}
nav.index{position:sticky;top:12px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 8px}
nav.index h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 4px}
nav.index a{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:15px}
nav.index a em{font-style:normal;font-family:var(--font-display);font-weight:700;color:var(--brand);min-width:38px}
nav.index a:hover{background:var(--shade)}
nav.index a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav.index a[aria-current="page"] em{color:var(--accent)}
.stage{min-width:0}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:14px}
.crumb .id{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--brand);background:var(--surface);border:1px solid var(--line);padding:1px 10px;border-radius:3px}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.appnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--shade)}
.appnav b{font-family:var(--font-display);font-size:20px;color:var(--brand);margin-right:12px}
.appnav a{padding:4px 10px;border-radius:3px;text-decoration:none;color:var(--ink);font-size:14px}
.appnav a.on{background:var(--brand);color:var(--brand-ink)}
.appnav .who{margin-left:auto;font-size:13px;color:var(--muted)}
.content{padding:20px 22px 24px}
.content h1{font-size:30px;margin-bottom:4px}
.content h2{font-size:22px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--shade)}
.btn{border:0;border-radius:4px;padding:9px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink)}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:14px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--shade);border:1px solid var(--line);padding:12px;border-radius:6px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=number]{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.list{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.row:nth-child(even){background:var(--shade)}
.row:last-child{border-bottom:0}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--brand);display:grid;place-items:center}
.row h3{font-size:21px}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:13px;padding:2px 8px;border-radius:3px;background:var(--shade);border:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--shade);color:var(--muted);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--shade)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.room{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden}
.room>header{padding:8px 12px;background:var(--shade);font-weight:600;display:flex;justify-content:space-between}
.cartbar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:6px;margin-top:12px}
.cartbar b{font-family:var(--font-display);font-size:20px}
.cartbar .btn{margin-left:auto}
.totals{margin-left:auto;max-width:340px;margin-top:12px}
.totals div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.totals .t{font-family:var(--font-display);font-size:26px;border:0;padding-top:10px}
.note{border-left:5px solid var(--accent);background:var(--warn-bg);padding:10px 14px;border-radius:0 4px 4px 0;margin:14px 0;font-size:15px}
.note.info{border-color:var(--brand);background:var(--shade)}
.note.okk{border-color:var(--ok);background:var(--ok-bg)}
.note.err{border-color:var(--bad);background:var(--bad-bg)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan{border:1.5px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.plan.sel{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.plan h3{font-size:26px}
.plan .p{font-family:var(--font-display);font-size:34px;color:var(--brand)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.steps span{padding:4px 12px;border-radius:99px;background:var(--shade);border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.gate{max-width:560px;margin:0 auto;border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center}
.gate .lock{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;word-break:break-word}
.code{font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:.12em;font-weight:700;padding:10px 16px;border:2px solid var(--ink);border-radius:4px;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:6px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.paper{background:#fff;color:#111;max-width:620px;margin:0 auto;border:1px solid #999;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:28px 32px;font-family:Arial,sans-serif;font-size:14px}
.paper h2{font-family:Arial,sans-serif;font-size:20px;margin:0 0 4px;color:#0f4c5c}
.paper hr{border:0;border-top:1px solid #bbb;margin:14px 0}
.paper .cut{border-top:2px dashed #555;margin:22px -10px 12px;position:relative}
.paper .cut::after{content:"✂ desprender y entregar al anfitrión";position:absolute;top:-10px;left:0;background:#fff;padding:0 8px;font-size:11px;color:#555}
.paper table th{color:#444;border-color:#999}.paper td{border-color:#ddd}.paper tbody tr:nth-child(even){background:#f6f6f6}
.mail{max-width:680px;margin:0 auto;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.mail header{padding:12px 16px;background:var(--shade);border-bottom:1px solid var(--line);font-size:14px}
.mail header div{display:flex;gap:10px}.mail header span{color:var(--muted);min-width:54px}
.mail .body{padding:18px 20px}
.mail .body h2{font-size:22px;margin-top:0}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
.tile b{display:block;font-family:var(--font-display);font-size:32px;color:var(--brand);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar i{display:block;height:16px;border-radius:2px;background:var(--brand)}
.bar .tr{background:var(--shade);border-radius:2px}
.sev{border-left:5px solid var(--bad)} .sev.w{border-left-color:var(--accent)}
.sheet{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.sheet h3{font-size:18px;margin-bottom:8px}
.sheet dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0;font-size:14px}
.sheet dt{color:var(--muted)} .sheet dd{margin:0}
.flow{font-size:13px;color:var(--muted);margin:0 0 12px}
/* Formularios de entrada */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;max-width:760px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.req{color:var(--bad);margin-left:2px}
.help{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600;min-height:0}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=time],textarea,.form select,.form input[type=number],.form input[type=date]{font:inherit;font-size:16px;padding:10px 10px;min-height:44px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:var(--shade);color:var(--muted)}
.errsum a{text-decoration:none}
[aria-invalid="true"]{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.valid{border-color:var(--ok)!important}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;min-height:44px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--brand);background:var(--shade)}
.choice input{width:18px;height:18px;accent-color:var(--brand)}
.counter{font-size:12px;color:var(--muted);text-align:right}
.errsum{border-left:5px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 4px 4px 0;margin:0 0 14px}
.errsum ul{margin:6px 0 0;padding-left:18px}.errsum a{color:var(--bad);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .btn{min-height:44px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
.pw{display:flex;gap:6px}.pw input{flex:1}
.beds td input,.beds td select{min-height:38px;padding:6px 8px;font-size:15px}
.review{border:1.5px solid var(--brand);border-radius:6px;padding:14px 16px;margin-top:14px;background:var(--shade)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.index{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  nav.index h3{display:none} nav.index a{white-space:nowrap}
  .row{grid-template-columns:48px 1fr}.row .act{grid-column:1/-1}
  .thumb{width:48px;height:48px}
  .kv,.sheet dl{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .bar{grid-template-columns:90px 1fr 60px}
  .content{padding:16px 14px}
}
@media (prefers-reduced-motion:no-preference){.frame{transition:opacity .15s}}
</style>
</head>
<body>
<div class="topbar"><b>HospedaRuta</b><span>Prototipo de entradas y salidas del sistema · Taller de Diseño de Sistemas (ISI601)</span><span class="tag">Datos ficticios</span></div>
<div class="layout">
  <nav class="index" id="index" aria-label="Índice de salidas"></nav>
  <main class="stage">
    <div class="crumb" id="crumb"></div>
    <div class="frame" id="frame"></div>
    <section class="sheet" id="ficha" aria-label="Ficha de la salida"></section>
  </main>
</div>

<script>
/* ---------- Datos ficticios (coherentes con el modelo físico de la semana 4) ---------- */
const clp = n => '$' + Math.round(n).toLocaleString('es-CL');
const fdate = s => { const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'}).replace('.', ''); };
const addMonths = (s, m) => { const d = new Date(s + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const nights = () => Math.max(1, Math.round((new Date(S.salida) - new Date(S.ingreso)) / 864e5));

const ALOJ = [
  {id:1, nombre:'Residencial El Arriero', comuna:'Linares', region:'Maule', anf:'María Soto', desc:'Estacionamiento para camionetas, cocina compartida y lavandería. Check-in desde las 18:00.',
   rooms:[{n:'Pieza 1', camas:[['Camarote inferior',9000,1],['Camarote superior',9000,1],['Individual 1 plaza',12000,0]]},
          {n:'Pieza 2', camas:[['Camarote inferior',9000,1],['Camarote superior',9000,1]]},
          {n:'Pieza 3', camas:[['Plaza y media',14000,1],['Individual 1 plaza',12000,1]]}]},
  {id:2, nombre:'Hospedaje Los Quillayes', comuna:'Parral', region:'Maule', anf:'Pedro Vidal', desc:'Piezas con baño privado, desayuno incluido y patio techado para vehículos.',
   rooms:[{n:'Dormitorio Norte', camas:[['Individual 1 plaza',11000,1],['Individual 1 plaza',11000,1],['Individual 1 plaza',11000,0]]},
          {n:'Dormitorio Sur', camas:[['Plaza y media',13500,1],['Individual 1 plaza',11000,0]]}]},
  {id:3, nombre:'Cabañas Río Renaico', comuna:'Collipulli', region:'La Araucanía', anf:'Sandra Muñoz', desc:'Cabañas de 4 camas con cocina equipada. Aceptan cuadrillas de hasta 20 personas.',
   rooms:[{n:'Cabaña 1', camas:[['Camarote inferior',12500,1],['Camarote superior',12500,1],['Camarote inferior',12500,1],['Camarote superior',12500,1]]},
          {n:'Cabaña 2', camas:[['Camarote inferior',12500,1],['Camarote superior',12500,1],['Camarote inferior',12500,0],['Camarote superior',12500,1]]}]},
  {id:4, nombre:'Residencial Pino Alto', comuna:'Mulchén', region:'Biobío', anf:'Jorge Riquelme', desc:'Residencial familiar cerca de la ruta. Comidas bajo pedido.',
   rooms:[{n:'Pieza 1', camas:[['Individual 1 plaza',8500,1],['Individual 1 plaza',8500,1]]},
          {n:'Pieza 2', camas:[['Individual 1 plaza',8500,1],['Individual 1 plaza',8500,0]]}]}
];
const camasLibres = a => a.rooms.reduce((s, r) => s + r.camas.filter(c => c[2]).length, 0);
const desde = a => Math.min(...a.rooms.flatMap(r => r.camas.map(c => c[1])));
const PLANES = [
  {id:1, nombre:'Básico', precio:19990, max:1, extra:['1 alojamiento publicado','Aviso de reservas por correo','Panel de reservas']},
  {id:2, nombre:'Profesional', precio:39990, max:3, extra:['Hasta 3 alojamientos','Aviso de reservas por correo','Panel de reservas y reportes']},
  {id:3, nombre:'Flota', precio:89990, max:10, extra:['Hasta 10 alojamientos','Aviso de reservas por correo','Reportes y soporte prioritario']}
];

const S = {
  aloj:1, comuna:'', ingreso:'2026-12-07', salida:'2026-12-11',
  cart:[{aloj:1, key:'1-0-0', room:'Pieza 1', tipo:'Camarote inferior', precio:9000},
        {aloj:1, key:'1-0-1', room:'Pieza 1', tipo:'Camarote superior', precio:9000},
        {aloj:1, key:'1-1-0', room:'Pieza 2', tipo:'Camarote inferior', precio:9000}],
  codigo:'HR-4K7Q-1207', tab:'pantalla', camas:1, f:{}, done:{}, pagadas:{}, e06r:null, e06step:0, e06err:'', e06ok:null, enviando:false,
  hab:[{n:'Pieza 1', camas:[{t:'Individual 1 plaza', p:''}]}],
  plan:2, meses:3, terminos:true, pago:'ok', orden:'HR-SUB-004821', tbk:'01ab9c3e5f7d2b84a6c0e91f3d58a7b24c6e0f19a3d7b5c8e2f40a61b9d3c7e5'
};
const planSel = () => PLANES.find(p => p.id === S.plan);
const totalSub = () => planSel().precio * S.meses;
const totalReserva = () => S.cart.reduce((s, i) => s + i.precio * nights(), 0);

/* ---------- Componentes ---------- */
const appnav = (on, who, items) => `<div class="appnav"><b>HospedaRuta</b>
  ${(items || ['Buscar','Mis reservas','Planes','Ayuda']).map(x => `<a href="#" data-act="noop" class="${x === on ? 'on' : ''}">${x}</a>`).join('')}
  <span class="who">${who}</span></div>`;
const foot = `<div class="foot"><a href="#" data-act="noop">Ayuda</a><a href="#" data-act="noop">Términos y condiciones</a><a href="#" data-act="noop">Privacidad (Ley N.º 19.628)</a><a href="#" data-act="noop">Contacto: soporte@hospedaruta.cl</a></div>`;
const house = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>`;
const steps = (arr, i) => `<div class="steps">${arr.map((x, k) => `<span class="${k === i ? 'on' : ''}">${k + 1}. ${x}</span>`).join('')}</div>`;
const mail = (to, subj, body) => `<div class="mail"><header>
  <div><span>De:</span>HospedaRuta &lt;no-responder@hospedaruta.cl&gt;</div><div><span>Para:</span>${to}</div><div><span>Asunto:</span><b>${subj}</b></div></header>
  <div class="body">${body}</div></div>`;

/* ---------- Entradas: datos maestros, utilidades y validaciones (controles internos) ---------- */
const HOY = '2026-11-25'; // fecha del sistema simulada para el prototipo

const cleanRut = s => String(s).replace(/[^0-9kK]/g, '').toUpperCase();
const dvRut = n => { let s = 0, m = 2; for (const d of String(n).split('').reverse()){ s += +d * m; m = m === 7 ? 2 : m + 1; } const r = 11 - s % 11; return r === 11 ? '0' : r === 10 ? 'K' : String(r); };
const fmtRut = s => { const c = cleanRut(s); if (c.length < 2) return s; return c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1); };
const fmtFono = s => { const d = String(s).replace(/\D/g, '').replace(/^56/, ''); return /^9\d{8}$/.test(d) ? `+56 ${d[0]} ${d.slice(1, 5)} ${d.slice(5)}` : s; };

function labelOf(el){
  if (el.type === 'radio') return el.closest('.field').querySelector('.lbl').textContent.replace('*', '').trim();
  const l = document.querySelector(`label[for="${el.id}"]`);
  return l ? l.textContent.replace('*', '').trim() : (el.getAttribute('aria-label') || el.id);
}
function vEl(el){
  const fn = V[el.dataset.v]; if (!fn) return '';
  const msg = fn(el.type === 'checkbox' ? '' : el.value, el);
  const key = el.type === 'radio' ? el.name : el.id;
  const e = document.getElementById(key + '-e'); if (e) e.textContent = msg;
  if (el.type === 'radio') el.form.querySelectorAll(`input[name="${el.name}"]`).forEach(r => r.setAttribute('aria-invalid', msg ? 'true' : 'false'));
  else { el.setAttribute('aria-invalid', msg ? 'true' : 'false'); el.classList.toggle('valid', !msg && el.value !== '' && el.type !== 'checkbox'); }
  return msg;
}
function vForm(form, extra){
  const seen = new Set(), errs = [];
  form.querySelectorAll('[data-v]').forEach(el => {
    if (el.closest('[hidden]')) return;
    const key = el.type === 'radio' ? el.name : el.id; if (seen.has(key)) return; seen.add(key);
    const m = vEl(el); if (m) errs.push([el.id, labelOf(el) + ': ' + m]);
  });
  (extra || []).forEach(x => errs.push(x));
  const sum = form.querySelector('.errsum');
  if (errs.length){ sum.hidden = false; sum.innerHTML = `<b>Revise ${errs.length} dato${errs.length > 1 ? 's' : ''} antes de continuar:</b><ul>${errs.map(x => `<li>${x[0] ? `<a href="#" data-act="focus" data-id="${x[0]}">${esc(x[1])}</a>` : esc(x[1])}</li>`).join('')}</ul>`; sum.focus(); }
  else { sum.hidden = true; sum.innerHTML = ''; }
  return errs.length === 0;
}

const inp = (id, v, type, attrs, def) => `<input type="${type}" id="${id}" name="${id}" data-v="${v}" value="${esc(val(id, def))}" aria-describedby="${id}-h ${id}-e" ${attrs || ''}>`;
const sel = (id, v, opts, def, attrs) => `<select id="${id}" name="${id}" data-v="${v}" aria-describedby="${id}-h ${id}-e" ${attrs || ''}>${opts}</select>`;
const opt = (value, text, cur) => `<option value="${esc(value)}" ${value === cur ? 'selected' : ''}>${esc(text == null ? value : text)}</option>`;

  <tr class="sev w"><td>HR-SUB-004803</td><td>Elena Parra</td><td><span class="pill bad">Rechazado</span></td><td class="num">${clp(39990)}</td></tr>
  <tr class="sev w"><td>HR-SUB-004811</td><td>Luis Fuentes</td><td><span class="pill warn">Tiempo excedido</span></td><td class="num">${clp(19990)}</td></tr></tbody></table></div></div>`;
}, ficha:{tipo:'Interna, reporte de excepción', aud:'Soporte y administración de HospedaRuta', met:'Pantalla con alertas por color y etiqueta; aviso por correo si hay casos críticos', frec:'Diario', fuente:'D3 Reservas y D4 Suscripciones, mediante vista con filtros', proc:'Consulta de gestión sobre procesos 4, 5 y 6', campos:'código, alojamiento o anfitrión, fecha, horas o días, tipo de alerta'}}
];

/* ---------- Render ---------- */
const lab = id => id[0].toUpperCase() + '-' + id.slice(1);
function drawIndex(cur){
  let g = '', out = '';
  SCREENS.forEach(s => { if (s.grupo !== g){ g = s.grupo; out += `<h3>${g}</h3>`; }
    out += `<a href="#${s.id}" data-act="go" data-to="${s.id}" ${s.id === cur ? 'aria-current="page"' : ''}><em>${lab(s.id)}</em>${s.nombre}</a>`; });
  document.getElementById('index').innerHTML = out;
}
function show(){
  const id = (location.hash || '#e01').slice(1);
  const s = SCREENS.find(x => x.id === id) || SCREENS[0];
  drawIndex(s.id);
  document.getElementById('crumb').innerHTML = `<span class="id">${lab(s.id)}</span><span>${s.grupo} › <b>${s.nombre}</b></span>`;
  document.getElementById('frame').innerHTML = s.render();
  let rows;
  if (s.fichaE){ rows = s.fichaE; }
  else { const f = s.ficha; rows = [['Tipo', f.tipo], ['Audiencia', f.aud], ['Método de implantación', f.met], ['Frecuencia', f.frec], ['Fuente de datos', f.fuente], ['Proceso del DFD', f.proc], ['Campos principales', f.campos]]; }
  document.getElementById('ficha').innerHTML = `<h3>Ficha de la ${s.fichaE ? 'entrada' : 'salida'} ${lab(s.id)}</h3><dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
  document.title = `${lab(s.id)} ${s.nombre} · Prototipo HospedaRuta`;
  if (s.id === 'e06' && S.e06err){ const el = document.getElementById('p-codigo'), e = document.getElementById('p-codigo-e'); if (el && e){ e.textContent = S.e06err; el.setAttribute('aria-invalid', 'true'); } }
}
const go = id => { if (location.hash === '#' + id) show(); else location.hash = id; window.scrollTo(0, 0); };
window.addEventListener('hashchange', show);
const store = el => { if (el.type === 'radio'){ if (el.checked) S.f[el.name] = el.value; } else if (el.type === 'checkbox') S.f[el.id] = el.checked; else if (el.id) S.f[el.id] = el.value; };
const clearKeys = pref => Object.keys(S.f).forEach(k => { if (pref.some(p => k === p || k.startsWith(p))) delete S.f[k]; });
const formOf = id => document.getElementById('f-' + id);

document.addEventListener('submit', e => e.preventDefault());
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset; const act = d.act;
  if (act === 'noop'){ e.preventDefault(); return; }
  if (act === 'go'){ e.preventDefault(); go(d.to); return; }
  if (act === 'focus'){ e.preventDefault(); const t = document.getElementById(d.id); if (t){ t.focus(); t.scrollIntoView({block:'center'}); } return; }
  if (act === 'alojamiento'){ S.aloj = +d.id; go('s02'); return; }
  if (act === 'addcama'){
    if (S.cart.length && S.cart[0].aloj !== +d.aloj) S.cart = [];
    S.cart.push({aloj:+d.aloj, key:d.key, room:d.room, tipo:d.tipo, precio:+d.precio}); show(); return; }
  if (act === 'rmcama'){ S.cart = S.cart.filter(i => i.key !== d.key); show(); return; }
  if (act === 'tab'){ S.tab = d.t; show(); return; }
  if (act === 'copy'){ try { navigator.clipboard.writeText(S.codigo).then(() => { document.getElementById('copied').textContent = 'Copiado'; }, () => {}); } catch (err) { document.getElementById('copied').textContent = 'Seleccione y copie el código'; } return; }
  if (act === 'plan'){ if (S.plan === +d.id){ go('s06'); } else { S.plan = +d.id; show(); } return; }
  if (act === 'pagar'){ S.orden = 'HR-SUB-' + String(Math.floor(Math.random() * 900000) + 100000); go('s07'); return; }
  if (act === 'sim'){ S.pago = d.r; go('s08'); return; }
  if (act === 'print'){ S.e06print = !S.e06print; show(); return; }
  /* E-01 */
  if (act === 'togglepw'){ const p = document.getElementById('pass'); const v = p.type === 'password'; p.type = v ? 'text' : 'password'; el.textContent = v ? 'Ocultar' : 'Mostrar'; return; }
  if (act === 'clear'){ clearKeys(['tipo','rut','nombre','correo','fono','pass','acepto']); show(); return; }
  if (act === 'submit-e01'){ const f = formOf('e01'); if (!vForm(f)) return;
    S.done.e01 = {rut:fmtRut(val('rut')), nombre:val('nombre'), correo:val('correo'), tipo:val('tipo')}; RUTS.push(fmtRut(val('rut'))); show(); return; }
  if (act === 'reset-e01'){ S.done.e01 = null; clearKeys(['tipo','rut','nombre','correo','fono','pass','acepto']); show(); return; }
  /* E-02 */
  if (act === 'addhab'){ S.hab.push({n:'Pieza ' + (S.hab.length + 1), camas:[{t:TIPOS_CAMA[0], p:''}]}); show(); return; }
  if (act === 'rmhab'){ S.hab.splice(+d.h, 1); show(); return; }
  if (act === 'addcamaH'){ const h = S.hab[+d.h], last = h.camas[h.camas.length - 1]; h.camas.push({t:last.t, p:last.p}); show(); return; }
  if (act === 'rmcamaH'){ S.hab[+d.h].camas.splice(+d.c, 1); show(); return; }
  if (act === 'submit-e02'){ const f = formOf('e02'), p = planSel(), extra = [];
    if (misAlojIds().length >= p.max) extra.push(['', `Su plan ${p.nombre} permite ${p.max} alojamiento${p.max > 1 ? 's' : ''} y ya los usó. Cambie a un plan superior para publicar otro.`]);
    if (S.hab.reduce((s, h) => s + h.camas.length, 0) > 30) extra.push(['', 'Un alojamiento puede tener hasta 30 camas.']);
    if (!vForm(f, extra)) return;
    const com = val('a-comuna'), id = Math.max(...ALOJ.map(a => a.id)) + 1;
    ALOJ.push({id, nombre:val('a-nombre').trim(), comuna:com, region:regionDe(com), anf:'María Soto', desc:val('a-desc') || 'Alojamiento publicado desde el prototipo.', rooms:S.hab.map(h => ({n:h.n.trim(), camas:h.camas.map(c => [c.t, +c.p, 1])}))});
    S.done.e02 = val('a-nombre').trim(); clearKeys(['a-','sv-']); S.hab = [{n:'Pieza 1', camas:[{t:TIPOS_CAMA[0], p:''}]}]; show(); window.scrollTo(0, 0); return; }
  /* E-03 */
  if (act === 'submit-e03'){ const f = formOf('e03'); if (!vForm(f)) return;
    S.comuna = val('b-comuna', S.comuna); S.ingreso = val('b-ingreso', S.ingreso); S.salida = val('b-salida', S.salida); S.camas = +val('b-camas', S.camas); go('s01'); return; }
  /* E-04 */
  if (act === 'submit-e04'){ if (S.enviando) return; const f = formOf('e04'); if (!vForm(f)) return;
    S.enviando = true; el.disabled = true; el.textContent = 'Procesando…';
    setTimeout(() => { S.codigo = 'HR-' + Math.random().toString(36).slice(2, 6).toUpperCase().padEnd(4, 'X') + '-' + S.ingreso.slice(8, 10) + S.ingreso.slice(5, 7); S.tab = 'pantalla'; S.enviando = false; S.e06r = null; S.e06step = 0; go('s04'); }, 700); return; }
  /* E-06 */
  const buscar = code => { S.f['p-codigo'] = code; S.e06err = ''; S.e06ok = null;
    const r = RESERVAS().find(x => x.codigo === code);
    if (!r) S.e06err = 'No existe una reserva con ese código. Revise el comprobante.';
    else if (!misAlojIds().includes(r.aloj)) S.e06err = 'Esta reserva corresponde al alojamiento de otro anfitrión. Solo puede confirmar reservas de sus alojamientos.';
    else if (r.estado === 'PAGADA') S.e06err = `Esta reserva ya fue registrada como PAGADA el ${fdate(r.fpago)}. No se puede registrar dos veces.`;
    else { S.e06r = r; S.e06step = 1; clearKeys(['p-monto','p-fecha','p-oper','medio']); }
    show(); };
  if (act === 'e06buscar'){ const c = document.getElementById('p-codigo'); c.value = MASK.codigo(c.value); store(c); if (vEl(c)) return; buscar(c.value); return; }
  if (act === 'e06qr'){ buscar(S.codigo); return; }
  if (act === 'e06otro'){ S.e06r = null; S.e06step = 0; S.e06err = ''; S.f['p-codigo'] = ''; show(); return; }
  if (act === 'e06revisar'){ const f = formOf('e06'); if (!vForm(f)) return; S.e06step = 2; show(); return; }
  if (act === 'e06corregir'){ S.e06step = 1; S.e06print = false; show(); return; }
  if (act === 'e06confirmar'){ const r = S.e06r; S.pagadas[r.codigo] = val('p-fecha', r.ingreso);
    S.e06ok = {codigo:r.codigo, monto:+val('p-monto'), medio:val('medio'), fecha:val('p-fecha', r.ingreso)};
    S.e06r = null; S.e06step = 0; S.e06print = false; clearKeys(['p-']); clearKeys(['medio']); show(); window.scrollTo(0, 0); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.hab != null){ const h = S.hab[+t.dataset.hab]; if (t.dataset.cama != null) h.camas[+t.dataset.cama][t.dataset.k] = t.value; else h.n = t.value; }
  else store(t);
  if (t.dataset.count){ const c = document.getElementById(t.id + '-c'); if (c) c.textContent = t.value.length + ' / ' + t.dataset.count; }
  if (t.getAttribute('aria-invalid') === 'true' && t.dataset.v) vEl(t);
  if (t.id === 'b-ingreso' || t.id === 'b-salida'){ const i = document.getElementById('b-ingreso').value, o = document.getElementById('b-salida').value; const n = (i && o && o > i) ? Math.round((new Date(o) - new Date(i)) / 864e5) : 0; document.getElementById('b-noches').textContent = n ? `Estadía de ${n} noche${n === 1 ? '' : 's'} (cálculo automático).` : ''; }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.dataset || !t.dataset.v || t.type === 'radio' || t.type === 'checkbox' || t.readOnly) return;
  if (MASK[t.dataset.v] && t.value){ t.value = MASK[t.dataset.v](t.value); store(t); }
  if (e.relatedTarget && e.relatedTarget.tagName === 'BUTTON') return; // el botón validará todo; evita mover el botón bajo el dedo
  if (t.value !== '' || t.getAttribute('aria-invalid') === 'true') vEl(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.hab != null && t.dataset.k === 't'){ S.hab[+t.dataset.hab].camas[+t.dataset.cama].t = t.value; return; }
  if (t.form && t.form.id && t.form.id.startsWith('f-')){
    store(t);
    if (t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT') vEl(t);
    if (t.id === 'a-comuna'){ document.getElementById('a-region').value = regionDe(t.value); }
    if (t.name === 'medio'){ const w = document.getElementById('p-oper-w'); w.hidden = t.value !== 'Transferencia'; }
    return;
  }
  if (t.id === 'comuna'){ S.comuna = t.value; show(); }
  if (t.id === 'ingreso' && t.value){ S.ingreso = t.value; if (new Date(S.salida) <= new Date(S.ingreso)) S.salida = new Date(new Date(S.ingreso).getTime() + 864e5).toISOString().slice(0, 10); show(); }
  if (t.id === 'salida' && t.value && new Date(t.value) > new Date(S.ingreso)){ S.salida = t.value; show(); } else if (t.id === 'salida'){ show(); }
  if (t.id === 'meses'){ S.meses = +t.value; show(); }
  if (t.id === 'terminos'){ S.terminos = t.checked; show(); }
});
show();
</script>
</body>
